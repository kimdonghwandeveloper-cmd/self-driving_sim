[package]
name = "sim-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Phase GD-1: 엔진과 무관한 시뮬레이터 로직. Godot 확장(crates/sim-godot)과 개발 명령(crates/sim-tools)이 함께 쓴다.

[dependencies]
# 지면 좌표 Vec2(sim-godot과 같은 판).
glam = "=0.32.1"
serde = { version = "=1.0.229", features = ["derive"] }
# 설정 파일(config/*.toml) 파싱. 루트 앱과 같은 판.
toml = "=1.1.8"
# Phase GD-1c 지도·타일 모듈(루트 앱과 같은 판). 지역 받기(Overpass)와 OSM 타일 HTTP.
ureq = "=3.5.1"
serde_json = "=1.0.154"
# 스냅샷·연결 정보 해시.
sha2 = "=0.11.1"
# 타일 PNG가 끝까지 디코딩되는지 검사.
png = "=0.18.1"
# Phase 4-5G Geofabrik PBF 읽기(순수 Rust, 기본 rust-zlib). GD-1에서 루트 앱에서 옮겼다.
osmpbf = "=0.3.8"
# PLAN 4-11 전국 지도 자료 조각 압축(deflate). 이미 osmpbf·png가 쓰는 판이라 새 외부 코드가 늘지 않는다.
flate2 = "=1.1.10"
