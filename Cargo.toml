[package]
name = "self-driving_sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
# Phase GD-0·GD-1: 엔진 무관 로직(sim-core)과 Godot 확장(sim-godot).
members = ["crates/sim-core", "crates/sim-godot", "crates/sim-tools"]
# sim-core 테스트도 기존 `cargo test`에 포함한다. sim-godot(cdylib)는 `-p sim-godot`로 따로 빌드한다.
default-members = [".", "crates/sim-core"]

[features]
default = []
# Compatibility check only. Collisions currently use the built-in ground check in crates/sim-core/src/vehicle/collision.rs.
physics = ["dep:bevy_rapier3d"]

[dependencies]
# Phase GD-1: 엔진과 무관한 로직. Bevy 컴포넌트 derive를 쓰려고 bevy 기능을 켠다.
sim-core = { path = "crates/sim-core", features = ["bevy"] }
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui"] }
bevy_rapier3d = { version = "=0.36.0", optional = true, default-features = false, features = ["dim3"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Phase 4-5G 지역 스냅샷·연결 정보·PBF 파일 식별 해시(SHA-256, 순수 Rust).
sha2 = "=0.11.1"
toml = "=1.1.8"
# Phase 4-4 지도 받기(Overpass). 기본 기능: rustls + ring 암호 + webpki 루트 인증서 + gzip. aws-lc-rs(cmake/NASM 필요)는 쓰지 않는다.
ureq = "=3.5.1"

[dev-dependencies]
# 루트 시험이 sim-core 합성 OSM 자료를 쓴다.
sim-core = { path = "crates/sim-core", features = ["bevy", "test-fixtures"] }

[profile.dev]
opt-level = 1
# 빌드 메모리 절감: 우리 crate는 줄 번호(백트레이스용)만 남기고 변수 디버그 정보는 뺀다.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# 외부 의존성(Bevy 등)은 디버그 정보를 만들지 않는다. rustc·링커 최대 메모리가 가장 크게 줄어든다.
debug = false
