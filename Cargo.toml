[package]
name = "self-driving_sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
# Phase 5-0: Godot 확장 crate. 기본 멤버는 루트 패키지뿐이라 기존 cargo 명령 동작은 같다.
members = ["crates/sim-godot"]

[features]
default = []
# Compatibility check only. Collisions currently use the built-in ground check in src/vehicle/collision.rs.
physics = ["dep:bevy_rapier3d"]

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui"] }
bevy_rapier3d = { version = "=0.36.0", optional = true, default-features = false, features = ["dim3"] }
# Phase 4-5G Geofabrik PBF 읽기(순수 Rust, 기본 rust-zlib).
osmpbf = "=0.3.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Phase 4-5G 지역 스냅샷·연결 정보·PBF 파일 식별 해시(SHA-256, 순수 Rust).
sha2 = "=0.11.1"
toml = "=1.1.8"
# Phase 4-4 지도 받기(Overpass). 기본 기능: rustls + ring 암호 + webpki 루트 인증서 + gzip. aws-lc-rs(cmake/NASM 필요)는 쓰지 않는다.
ureq = "=3.5.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
