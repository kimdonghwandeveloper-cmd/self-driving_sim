# GD-5(2026-11-10 사용자 결정): Bevy 앱을 지우고 루트는 작업 공간 설정만 둔다.
# - crates/sim-core: 엔진과 무관한 로직(차량·충돌·코스·지도·경로·설정).
# - crates/sim-godot: Godot 확장(cdylib). `cargo build -p sim-godot` 뒤 godot/에서 연다.
# - crates/sim-tools: 창 없는 개발 명령(지도 받기, PBF 추출·대조).
[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-godot", "crates/sim-tools"]

[profile.dev]
opt-level = 1
# 빌드 메모리 절감: 우리 crate는 줄 번호(백트레이스용)만 남기고 변수 디버그 정보는 뺀다.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# 외부 의존성은 디버그 정보를 만들지 않는다. rustc·링커 최대 메모리가 가장 크게 줄어든다.
debug = false
