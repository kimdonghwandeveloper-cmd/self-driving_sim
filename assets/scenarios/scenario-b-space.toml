# 시나리오 B · 공간 판단(Phase 5-3). 형식 설명은 docs/scenarios.md.
# training 코스에 원뿔 두 개를 더 놓아 피해 가기 → 원뿔과 고정 장애물 사이 문(폭 약 2.5 m) → 좁은 통로(폭 3.0 m)
# → 끝 벽 앞 정차. 차체 폭은 1.8 m다. 접촉(충돌)은 모두 기록되고, 세 번째 접촉에서 실패한다.
# 모든 값은 훈련용 임시값이며 교육 담당자가 확인한 시나리오·기준이 아니다.
# 좌표는 training 코스 지면 (x, z) m(시작 후륜축이 원점, 전방 -Z), 위치 조건은 차체 중심 기준이다.
# 코스에 원래 있는 것: 오른쪽 고정 장애물 (1.9, -32) 0.8 m 상자, 좁은 통로 z = -42..-54(가벽 사이 x = -1.5..1.5), 끝 벽 z = -66.

format = 1
title = "시나리오 B · 공간 판단"
briefing = """차로 가운데의 원뿔을 왼쪽으로 피하고, 왼쪽 원뿔과 오른쪽 장애물 사이의 문을 지나,
좁은 통로를 빠져나간 뒤 끝 벽 앞 정차 구역에 멈춥니다(차체 폭 1.8 m, 문 약 2.5 m, 통로 3.0 m).
천천히(10 km/h 이하) 가고, 옆 시점(키보드 3·4)으로 간격을 확인하세요. 세 번째 접촉에서 실패합니다."""
course = "training"

[start]
engine_on = true
gear = "P"

[[steps]]
id = "drive"
guide = "기어를 D로 바꾸세요(키보드 J · 게임패드 X)."
done = { kind = "gear", gear = "D" }

[[steps]]
id = "avoid-cone"
guide = "앞의 원뿔을 왼쪽으로 피해 지나가세요."
done = { kind = "reach", position_m = [-0.6, -22.0], radius_m = 1.6 }

[[steps]]
id = "gate"
guide = "왼쪽 원뿔과 오른쪽 장애물 사이의 문을 똑바로 지나가세요."
done = { kind = "reach", position_m = [0.25, -35.0], radius_m = 1.2 }

[[steps]]
id = "passage"
guide = "가운데를 맞춰 좁은 통로를 지나가세요."
done = { kind = "reach", position_m = [0.0, -56.5], radius_m = 1.2 }

[[steps]]
id = "stop"
guide = "끝 벽 앞 정차 구역에 멈추세요(벽에 닿지 않게)."
done = { kind = "stop_in", position_m = [0.0, -60.0], radius_m = 1.5 }

[[steps]]
id = "park"
guide = "기어를 P로 바꾸면 끝납니다(키보드 I · 게임패드 Y)."
done = { kind = "gear", gear = "P" }

[[events]]
id = "gate-ahead"
when = { kind = "step_done", step = "avoid-cone" }
action = { kind = "message", text = "문 폭은 약 2.5 m입니다. 미리 가운데를 맞추세요.", duration_s = 4.0 }

[[events]]
id = "passage-ahead"
when = { kind = "step_done", step = "gate" }
action = { kind = "message", text = "좁은 통로입니다. 속도를 줄이고 똑바로 들어가세요.", duration_s = 4.0 }

# 차로 가운데 오른쪽(x = 0.3..1.3)을 막는 원뿔.
[[obstacles]]
position_m = [0.8, -18.0]
size_m = [1.0, 1.0]
height_m = 0.7

# 오른쪽 고정 장애물(1.5..2.3)과 함께 문(x = -1.0..1.5)을 만드는 왼쪽 원뿔.
[[obstacles]]
position_m = [-1.4, -32.0]
size_m = [0.8, 0.8]
height_m = 0.7

[end]
time_limit_s = 300.0
max_collisions = 2

[record]
speed_limit_kmh = 10.0
harsh_steer_kmh = 6.0
