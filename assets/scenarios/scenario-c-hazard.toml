# 시나리오 C · 돌발 상황(Phase 5-4). 형식 설명은 docs/scenarios.md.
# 출발해 10 m를 지나면 오른쪽 보도에서 보행자 대체 객체가 차로를 가로질러 걷기 시작한다(결정적 스크립트, AI 아님).
# 매번 같은 이동 거리·같은 경로·같은 속도로 나오므로 반복해도 같은 조건이다.
# 기록: 위험 등장 시점(그때 속도·거리), 제동 시작 시점(반응 시간), 보행자와의 충돌 여부(충돌하면 바로 실패).
# 모든 값은 훈련용 임시값이며 교육 담당자가 확인한 시나리오·기준이 아니다.
# 좌표는 training 코스 지면 (x, z) m(시작 후륜축이 원점, 전방 -Z), 위치 조건은 차체 중심 기준이다.

format = 1
title = "시나리오 C · 돌발 상황"
briefing = """시동을 켜고 D로 출발해 차로 가운데로 나아갑니다(15 km/h 이하).
도중에 무언가 나타나면 바로 제동해 멈추고, 지나간 뒤 다시 출발해 앞의 정차 구역에 멈춘 다음 P로 바꿉니다.
보행자와 부딪히면 바로 실패합니다."""
course = "training"

[start]
engine_on = false
gear = "P"

[[steps]]
id = "engine"
guide = "시동을 켜세요(키보드 Enter · 게임패드 Start)."
done = { kind = "engine_on" }

[[steps]]
id = "drive"
guide = "기어를 D로 바꾸세요(키보드 J · 게임패드 X)."
done = { kind = "gear", gear = "D" }

[[steps]]
id = "go"
guide = "차로 가운데로 나아가세요(15 km/h 이하)."
done = { kind = "travel", distance_m = 10.0 }

[[steps]]
id = "yield"
guide = "앞을 잘 보며 주행하세요. 위험하면 바로 멈추세요."
done = { kind = "stopped" }

[[steps]]
id = "proceed"
guide = "보행자가 지나간 뒤 다시 출발하세요."
done = { kind = "reach", position_m = [0.0, -32.0], radius_m = 1.5 }

[[steps]]
id = "stop"
guide = "좁은 통로 앞 정차 구역에 멈추세요."
done = { kind = "stop_in", position_m = [0.0, -37.0], radius_m = 1.5 }

[[steps]]
id = "park"
guide = "기어를 P로 바꾸면 끝납니다(키보드 I · 게임패드 Y)."
done = { kind = "gear", gear = "P" }

# 오른쪽 보도(x = 4.0)에서 왼쪽 보도(x = -4.0)로 z = -26을 1.3 m/s로 건넌다. 다 건너면 사라진다.
[[hazards]]
id = "pedestrian"
path_m = [[4.0, -26.0], [-4.0, -26.0]]
speed_mps = 1.3
size_m = [0.6, 0.6]
height_m = 1.7

[[events]]
id = "pedestrian-steps-out"
when = { kind = "step_done", step = "go" }
action = { kind = "spawn_hazard", hazard = "pedestrian" }

[[events]]
id = "yielded"
when = { kind = "step_done", step = "yield" }
action = { kind = "message", text = "잘 멈췄습니다. 보행자가 지나갈 때까지 기다리세요.", duration_s = 4.0 }

[end]
time_limit_s = 240.0
max_collisions = 0
