# 차량 설정. 전진 최고 속도(40 km/h, 실차 사양)를 뺀 모든 값은 실차 검증 전 시뮬레이터 임시값입니다.

[state_machine]
# 이 속도(m/s) 이하이면 정지로 판정합니다. 허용 범위 0.0 ~ 0.5.
# 정지 상태에서만 시동 ON/OFF, P 변경, 비상 정지 해제가 허용됩니다.
# D/R은 정지 상태이거나 움직이는 방향과 같을 때만 허용됩니다(N은 항상 허용).
stop_threshold_mps = 0.05

[dynamics]
# 운동 모델 파라미터. 0 허용이라고 적힌 값을 뺀 모든 값은 0보다 커야 합니다. 1 m/s = 3.6 km/h.
# D 최고 속도(m/s). 11.111 m/s = 40 km/h, 실차 사양. R 최고 속도는 임시값.
max_forward_speed_mps = 11.111111
max_reverse_speed_mps = 1.5
# 가속 입력 최대일 때 저속 가속도(m/s²). 속도가 오르면 출력 한계(출력 ÷ (질량 × 속도))로 줄어듭니다.
max_accel_mps2 = 1.0
# 차량 질량(kg), 최대 구동 출력(kW). 모두 임시값.
mass_kg = 3000.0
max_drive_power_kw = 20.0
# 구름 저항 계수(0 허용, 감속 = 계수 × 9.81), 공기 저항 면적 Cd·A(m², 0 허용, 감속 = ½·1.225·CdA·v² ÷ 질량).
rolling_resistance_coeff = 0.015
drag_area_m2 = 3.5
# 제동 입력 최대일 때 더하는 감속도(m/s²).
# 제동·관성·비상·저항 감속도는 최종값이 아니라 서로 더해지는 성분입니다.
# 기본값·저속에서 가속 없이 최대 제동 ≈ 3.0 + 0.15 + 0.147 = 3.3, 비상 정지만 ≈ 5.3, 둘 다 ≈ 8.3 m/s²
# (속도가 높으면 공기 저항이 조금 더해집니다).
max_brake_decel_mps2 = 3.0
# 가속 입력이 없을 때(관성 주행, N) 더하는 감속도(m/s², 0 허용). 저항과 별도입니다.
coast_decel_mps2 = 0.15
# 비상 정지 중 더하는 감속도(m/s²)
emergency_decel_mps2 = 5.0
# 축간거리(m), 최대 바퀴 조향각(도, 60 이하), 조향각 변화 속도(도/s)
wheelbase_m = 2.8
max_steer_angle_deg = 30.0
steer_rate_deg_s = 60.0
# 언더스티어 계수(rad/g, 0 허용). 곡률 = tan(조향각) ÷ (축간거리 + 계수 × v² ÷ 9.81). 0이면 속도와 무관.
understeer_gradient_rad_per_g = 0.03
# 횡가속도 상한(m/s²). 40 km/h에서 최소 회전 반경 ≈ 11.11² ÷ 6 ≈ 20.6 m.
max_lateral_accel_mps2 = 6.0
# 조향 감도(배율). 조향 입력에 곱한 뒤 최대 입력 범위로 자릅니다.
# 1.0 = 입력 그대로, 0.5 = 끝까지 꺾어도 최대 조향각의 절반, 2.0 = 입력 절반에서 최대 조향각.
steer_sensitivity = 1.0
# 조향 입력을 놓았을 때(중립) 처리 방식. 실차 동작 미확정이라 고를 수 있습니다.
# "auto" = 아래 복귀 속도(도/s)로 0도까지 돌아감, "hold" = 놓은 각도를 유지.
# 입력 중에는 두 방식 모두 입력 위치가 목표 조향각이므로, hold에서 반대 입력을 주면 반대쪽 각도까지 움직입니다.
steer_return = "auto"
steer_return_rate_deg_s = 60.0
