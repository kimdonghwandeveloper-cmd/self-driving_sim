# 차량 설정. 모든 값은 실차 검증 전 시뮬레이터 임시값입니다.

[state_machine]
# 이 속도(m/s) 이하이면 정지로 판정합니다. 허용 범위 0.0 ~ 0.5.
# 정지 상태에서만 시동 ON/OFF, P 변경, 비상 정지 해제가 허용됩니다.
# D/R은 정지 상태이거나 움직이는 방향과 같을 때만 허용됩니다(N은 항상 허용).
stop_threshold_mps = 0.05

[dynamics]
# 운동 모델 파라미터. 관성 감속도(0 허용)를 뺀 모든 값은 0보다 커야 합니다. 1 m/s = 3.6 km/h.
# D / R 최고 속도(m/s)
max_forward_speed_mps = 5.0
max_reverse_speed_mps = 1.5
# 가속 입력 최대일 때 가속도, 제동 입력 최대일 때 더하는 감속도(m/s²)
# 제동·관성·비상 감속도는 최종값이 아니라 서로 더해지는 성분입니다.
# 기본값에서 가속 없이 최대 제동 = 3.0 + 0.3 = 3.3, 비상 정지만 = 5.3, 둘 다 = 8.3 m/s².
max_accel_mps2 = 1.0
max_brake_decel_mps2 = 3.0
# 가속 입력이 없을 때(관성 주행, N) 더하는 감속도(m/s²). 0이면 감속 없이 계속 굴러갑니다.
coast_decel_mps2 = 0.3
# 비상 정지 중 더하는 감속도(m/s²)
emergency_decel_mps2 = 5.0
# 축간거리(m), 최대 바퀴 조향각(도, 60 이하), 조향각 변화 속도(도/s)
wheelbase_m = 2.8
max_steer_angle_deg = 30.0
steer_rate_deg_s = 60.0
# 조향 감도(배율). 조향 입력에 곱한 뒤 최대 입력 범위로 자릅니다.
# 1.0 = 입력 그대로, 0.5 = 끝까지 꺾어도 최대 조향각의 절반, 2.0 = 입력 절반에서 최대 조향각.
steer_sensitivity = 1.0
# 조향 입력을 놓았을 때(중립) 처리 방식. 실차 동작 미확정이라 고를 수 있습니다.
# "auto" = 아래 복귀 속도(도/s)로 0도까지 돌아감, "hold" = 놓은 각도를 유지.
# 입력 중에는 두 방식 모두 입력 위치가 목표 조향각이므로, hold에서 반대 입력을 주면 반대쪽 각도까지 움직입니다.
steer_return = "auto"
steer_return_rate_deg_s = 60.0
