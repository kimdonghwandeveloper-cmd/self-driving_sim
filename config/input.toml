# 개발용 입력 매핑(임시). 실제 장비 규칙으로 확인된 값이 아닙니다.
# [keyboard] 키 이름은 Bevy KeyCode 이름을 사용합니다.
#   KeyA..KeyZ, Digit0..Digit9, ArrowUp/ArrowDown/ArrowLeft/ArrowRight,
#   Space, Enter, Backspace, Escape, Tab, ShiftLeft/ShiftRight,
#   ControlLeft/ControlRight, AltLeft/AltRight
# 동작마다 키를 여러 개 지정할 수 있고, 한 키를 두 동작에 지정할 수 없습니다.
# 잘못된 값이 있으면 경고 로그를 남기고 기본 매핑을 사용합니다.

[keyboard]
throttle = ["KeyW", "ArrowUp"]
brake = ["KeyS", "ArrowDown"]
steer_left = ["KeyA", "ArrowLeft"]
steer_right = ["KeyD", "ArrowRight"]
gear_park = ["KeyI"]
gear_reverse = ["KeyL"]
gear_neutral = ["KeyK"]
gear_drive = ["KeyJ"]
engine_toggle = ["Enter"]
emergency_stop = ["Space"]
emergency_release = ["Backspace"]
# 정지 상태에서 시작 위치(원점, 전방 -Z)로 복귀합니다. 보정 시험을 같은 코스에서 반복할 때 씁니다.
reset_course = ["KeyR"]

# Xbox 유형 게임패드. 버튼 이름: A, B, X, Y, LB, RB, Back, Start, LS, RS,
#   DPadUp/DPadDown/DPadLeft/DPadRight (LT/RT는 아날로그 축이라 버튼 동작에 쓸 수 없습니다)
# 한 버튼을 두 동작에 지정할 수 없고, 잘못된 값이 있으면 기본 게임패드 매핑을 사용합니다.
[gamepad]
# "triggers": 왼쪽 스틱 좌우=조향, RT=가속, LT=제동
# "sticks": 왼쪽 스틱 위=가속, 아래=제동, 오른쪽 스틱 좌우=조향 (PLAN.md 0-1절)
layout = "triggers"
# 데드존(0..=0.9). 이 값 이하의 입력은 0이며, 바깥 범위는 0..1로 다시 늘립니다.
stick_deadzone = 0.12
trigger_deadzone = 0.05
gear_park = "Y"
gear_reverse = "B"
gear_neutral = "A"
gear_drive = "X"
engine_toggle = "Start"
emergency_stop = "RB"
emergency_release = "Back"
