# 입석 조작자 1인칭 카메라(임시값). 실측값이 아니며, 기준 사진
# Car_photo/KakaoTalk_261030_131310_61.jpg 의 구도(넓은 창, 양옆 두꺼운 내장재, 화면 아래 약 1/4의 선반)에
# 맞춰 보정한 개발용 값입니다. 잘못된 값이 있으면 경고 로그를 남기고 기본값을 사용합니다.
#
# 차량 로컬 좌표: 원점은 후륜축 중심, +X 오른쪽, +Y 위, -Z 전방. 단위는 m / deg.

[operator_view]
# 눈 위치 [x, y, z] (m). 전·후·좌·우 시점 모두 이 위치에서 시선만 돌립니다.
eye_m = [0.0, 1.65, -2.75]
# 시선 pitch (deg, -45..=45). 음수면 아래를 봅니다. 네 방향에 같은 값을 씁니다.
pitch_deg = -3.0
# 수직 시야각 (deg, 30..=110). 가로 시야각은 창 화면비로 정해집니다.
vertical_fov_deg = 62.0
# near clip (m, 0.01..=0.5)
near_clip_m = 0.05
# 차체 기울기·상하 움직임(서스펜션, 2-8)을 카메라가 따라가는 정도 (0..=1).
# 0 = 카메라는 기울지 않음(멀미가 나면 0), 1 = 차체와 똑같이 기욺. 외부 디버그 카메라에는 적용하지 않습니다.
body_follow = 0.5
