# 여수 엑스포 · 내 맵 도로 코스(사용자 제작 BlenderGIS 맵의 도로 중심선으로 만든다, PLAN 4-11b).
# - 중심선 자료: tools/blender/yeosu_background.py가 내보낸 custom-roads.json(배경 GLB와 같은 좌표).
# - 폭을 넓히고 꺾이는 곳을 둥글게 다듬은 도로 면의 바깥 경계에 연석을 세운다. 막다른 끝은 연석 없이 열려 있다.
# - 맵에 있는 길(보도·산책로 포함)은 모두 주행 도로다.
# - 출처: © OpenStreetMap contributors, ODbL — https://www.openstreetmap.org/copyright
# 실행: Godot 메인 메뉴에서 "여수 엑스포 · 내 맵 도로" 선택(map:testdata/yeosu-expo/custom-roads.toml)

format = "road-lines-v1"
name = "yeosu-custom-roads"
# 중심선 자료 경로(이 파일 기준 상대 경로).
lines = "custom-roads.json"
# 맵 폭(약 4.9 m)에 곱하는 배율과 최소 폭(m). 사용자 결정(2026-11-13) 임시값.
width_scale = 1.5
min_width_m = 3.5
# 시작 자세: 기존 여수 코스(course.toml)의 시작 자세와 같은 곳(후륜축 [x, z] m, 방향 deg).
start = [-3.46, 4.53]
start_heading_deg = 142.56
notices = [
    "Map data (c) OpenStreetMap contributors, ODbL - openstreetmap.org/copyright",
    "사용자 제작 맵의 도로 면으로 만든 가상 교육 코스입니다(실측 도로 아님)",
]
